services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: surveyor
      POSTGRES_USER: surveyor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surveyor -d surveyor"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgres://surveyor:${POSTGRES_PASSWORD}@db:5432/surveyor?sslmode=disable
      AUTH_ALLOW_ANONYMOUS: ${AUTH_ALLOW_ANONYMOUS:-true}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      INITIAL_ADMIN_USER_ID: ${INITIAL_ADMIN_USER_ID:-}
      PROVIDER_QUOTA_SCOPE: ${PROVIDER_QUOTA_SCOPE:-}
      GEMINI_DAILY_CALL_LIMIT: ${GEMINI_DAILY_CALL_LIMIT:-0}
      OLLAMA_DAILY_CALL_LIMIT: ${OLLAMA_DAILY_CALL_LIMIT:-0}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      OLLAMA_ENDPOINT: ${OLLAMA_ENDPOINT:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_NEMOTRON_MODEL: ${NVIDIA_NEMOTRON_MODEL:-nvidia/nemotron-3.5-super-vl-120b-a12b}
      NVIDIA_NIM_BASE_URL: ${NVIDIA_NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_DAILY_CALL_LIMIT: ${NVIDIA_DAILY_CALL_LIMIT:-0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ROOM_DESIGN_PROVIDER: ${ROOM_DESIGN_PROVIDER:-}
      ROOM_DESIGN_FALLBACK: ${ROOM_DESIGN_FALLBACK:-}
      LOCAL_IMAGE_ENDPOINT: ${LOCAL_IMAGE_ENDPOINT:-}
      LOCAL_IMAGE_MODEL: ${LOCAL_IMAGE_MODEL:-}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-1}
      NVIDIA_FLUX_MODEL: ${NVIDIA_FLUX_MODEL:-black-forest-labs/flux.1-dev}
      NVIDIA_NIM_IMAGE_ENDPOINT: ${NVIDIA_NIM_IMAGE_ENDPOINT:-}
      ROOM_DESIGN_DAILY_IMAGE_LIMIT: ${ROOM_DESIGN_DAILY_IMAGE_LIMIT:-4}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-3001}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data: